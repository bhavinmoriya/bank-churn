[project]
name = "bank-churn"
version = "0.1.0"
description = "Learn churn modeling from scratch: banking churn prediction, retention strategy, Gradio app"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "gradio",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
